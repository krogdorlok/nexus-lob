name: AWS run smoke test

# Runs the same benchmark steps the EC2 instance runs (scripts/aws/remote_bench.sh) on a
# GitHub runner, writing to a local directory instead of S3, so a broken script is caught here
# instead of on a launched instance. No AWS credentials are involved.
on:
  push:
    paths: ['scripts/**', '.github/workflows/aws-smoke.yml']
  workflow_dispatch:

jobs:
  remote-bench:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Lint scripts
        run: |
          sed -e 's|__BUCKET__|b|;s|__PREFIX__|p|;s|__COMMIT__|c|;s|__REPO__|r|;s|__MAX_MINUTES__|75|' \
            scripts/aws/userdata.sh > "$RUNNER_TEMP/userdata.sh"
          (cd scripts/aws && shellcheck -x setup.sh teardown.sh)
          shellcheck -x scripts/*.sh scripts/aws/launch_bench.sh scripts/aws/remote_bench.sh \
            "$RUNNER_TEMP/userdata.sh"

      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y ninja-build g++-13

      - name: Run the instance's benchmark steps locally
        env:
          CC: gcc-13
          CXX: g++-13
          REPS: 1
        run: scripts/aws/remote_bench.sh "$RUNNER_TEMP/run"

      - name: Check the run is complete and renders
        run: |
          test -f "$RUNNER_TEMP/run/DONE"
          for f in machine.txt manifest.txt fuzz.txt mutation.txt micro.json \
                   replay_nexus.txt replay_naive.txt; do
            test -s "$RUNNER_TEMP/run/$f" || { echo "missing $f"; exit 1; }
          done
          printf '<!-- RESULTS_AWS -->\n<!-- /RESULTS_AWS -->\n' >> README.md
          python3 scripts/make_results_table.py "$RUNNER_TEMP/run" RESULTS_AWS
          python3 scripts/compare_results.py "$RUNNER_TEMP/run" "$RUNNER_TEMP/run"
