name: CI

on:
  push:
  pull_request:

jobs:
  build-test:
    name: ${{ matrix.compiler.name }} / ${{ matrix.preset }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler:
          - { name: gcc-13, cc: gcc-13, cxx: g++-13 }
          - { name: clang-17, cc: clang-17, cxx: clang++-17 }
        preset: [asan, tsan, release]
    env:
      CC: ${{ matrix.compiler.cc }}
      CXX: ${{ matrix.compiler.cxx }}
    steps:
      - uses: actions/checkout@v5

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build g++-13 clang-17
          # TSan cannot map its shadow memory with the runner's default ASLR entropy.
          sudo sysctl vm.mmap_rnd_bits=28

      - name: Configure
        run: >
          cmake --preset ${{ matrix.preset }}
          -DNEXUS_WERROR=${{ matrix.preset == 'asan' && 'ON' || 'OFF' }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }}

      - name: Full differential fuzz
        if: matrix.preset == 'release'
        run: ./build/release/fuzz_differential --seeds 200 --commands 100000

      - name: Fuzzer mutation check
        if: matrix.preset == 'release'
        run: scripts/mutation_check.sh
